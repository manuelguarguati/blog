services:
  # Backend Web Service (FastAPI + Docker)
  - type: web
    name: bibi-backend
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    envVars:
      - key: DATABASE_URL
        value: postgresql://neondb_owner:npg_QRpKfD5P2NbX@ep-tiny-voice-bey0v8h3-pooler.c-9.us-east-2.aws.neon.tech/neondb?sslmode=require&channel_binding=require

  # Frontend Static Site (React + Vite)
  - type: web
    name: bibi-blog
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: bibi-backend
          property: host
