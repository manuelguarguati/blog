databases:
  - name: bibi-db
    databaseName: bibidb
    user: bibiuser
    plan: free

services:
  # Backend Web Service (FastAPI + Docker)
  - type: web
    name: bibi-backend
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bibi-db
          property: connectionString

  # Frontend Static Site (React + Vite)
  - type: web
    name: bibi-blog
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: bibi-backend
          property: host
